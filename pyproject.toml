[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-lockin-2tone"
version = "0.1.0"
description = "Two-tone lock-in detection on a Red Pitaya SIGNALlab 250-12"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout"]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a connected Red Pitaya (deselect with '-m \"not hardware\"')",
    "slow: takes more than ~10 s",
]
addopts = "-m 'not hardware' --strict-markers"
