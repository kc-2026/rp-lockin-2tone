[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-lockin-2tone"
version = "0.1.0"
description = "Two-tone lock-in detection on a Red Pitaya SIGNALlab 250-12"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout"]
plot = ["matplotlib>=3.6"]
# Only the Santec laser needs this, and only over USB/serial. Kept out of
# the core dependencies so the package imports and the suite runs without it.
laser = ["pyserial>=3.5"]
# scripts/laser_comms_diag.py probes the D2XX driver path as well as the VCP
# one, and imports ftd2xx to do it. It was installed by hand on the 2026-08-14
# machine and never declared, so a fresh machine hits an ImportError in the
# middle of diagnosing the laser -- which is the worst possible moment.
laser-d2xx = ["pyserial>=3.5", "ftd2xx>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a connected Red Pitaya (deselect with '-m \"not hardware\"')",
    "slow: takes more than ~10 s",
]
addopts = "-m 'not hardware' --strict-markers"
